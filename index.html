<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Drowsy: the sleep alarm</title>


  <!-- =========================
       MEDIAPIPE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


  <!-- =========================
       FIREBASE
       ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #eeeeee;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
    }

    #status {
      font-size: 30px;
      font-weight: bold;
      margin: 20px;
    }

    #firebaseStatus {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
    }

    button {
      font-size: 18px;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

  </style>

</head>


<body>


  <h1>Drowsy: the sleep alarm</h1>

  <h2>for drivers</h2>


  <!-- CAMERA BUTTONS -->

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="stopCamera()">
    ⛔ Camera Off
  </button>


  <br><br>


  <!-- CAMERA -->

  <video id="video"
         autoplay
         playsinline>
  </video>


  <!-- EYE STATUS -->

  <div id="status">
    Camera OFF
  </div>


  <!-- FIREBASE STATUS -->

  <div id="firebaseStatus">
    Connecting to Firebase...
  </div>


  <!-- FIREBASE TEST BUTTON -->

  <button onclick="testFirebase()">
    🧪 Test Firebase
  </button>


<script>


// ======================================================
// FIREBASE CONFIG
// ======================================================

const firebaseConfig = {

  apiKey: "AIzaSyAuIPwcMswWZQEq0MNxvqA8",

  authDomain: "drowsy-ff59c.firebaseapp.com",

  databaseURL:
    "https://drowsy-ff59c-default-rtdb.firebaseio.com",

  projectId: "drowsy-ff59c",

  storageBucket:
    "drowsy-ff59c.firebasestorage.app",

  messagingSenderId: "1079489940696",

  appId:
    "1:1079489940696:web:99498117829688ba7b5bad",

  measurementId: "G-1F7QS9KWJ7"

};


// ======================================================
// INITIALIZE FIREBASE
// ======================================================

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


// ======================================================
// HTML ELEMENTS
// ======================================================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const firebaseStatus =
  document.getElementById("firebaseStatus");


// ======================================================
// FIREBASE CONNECTION STATUS
// ======================================================

firebaseStatus.innerHTML =
  "🟢 Firebase connected";


// ======================================================
// VARIABLES
// ======================================================

let faceMesh = null;

let cameraStream = null;

let detecting = false;


// Current eye status

let currentEyeStatus = "eye open";


// Firebase timer

let firebaseTimer = null;


// ======================================================
// TEST FIREBASE
// ======================================================

function testFirebase() {

  firebaseStatus.innerHTML =
    "⏳ Testing Firebase write...";


  database.ref("test").push({

    message: "Hello from Drowsy!",

    time: Date.now()

  })


  .then(() => {

    firebaseStatus.innerHTML =
      "✅ Firebase WRITE successful";

  })


  .catch((error) => {

    console.log(
      "Firebase error:",
      error
    );

    firebaseStatus.innerHTML =
      "❌ Firebase WRITE failed: "
      + error.message;

  });

}


// ======================================================
// SEND EYE STATUS TO FIREBASE
// EVERY 1 SECOND
// ======================================================

function sendEyeStatusToFirebase() {


  if (!detecting) {

    return;

  }


  database.ref("drowsy").push({

    eyeStatus: currentEyeStatus,

    timestamp: Date.now()

  })


  .then(() => {

    console.log(
      "Firebase:",
      currentEyeStatus
    );

    firebaseStatus.innerHTML =
      "🟢 Firebase: " +
      currentEyeStatus;

  })


  .catch((error) => {

    console.log(
      "Firebase error:",
      error
    );

    firebaseStatus.innerHTML =
      "🔴 Firebase error";

  });

}


// ======================================================
// START FIREBASE TIMER
// ======================================================

function startFirebaseTimer() {


  // Send first data immediately

  sendEyeStatusToFirebase();


  // Then every 1 second

  firebaseTimer = setInterval(

    sendEyeStatusToFirebase,

    1000

  );

}


// ======================================================
// STOP FIREBASE TIMER
// ======================================================

function stopFirebaseTimer() {


  if (firebaseTimer) {

    clearInterval(firebaseTimer);

    firebaseTimer = null;

  }

}


// ======================================================
// START CAMERA
// ======================================================

async function startCamera() {


  if (cameraStream) {

    return;

  }


  try {


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user"

        }

      });


    video.srcObject =
      cameraStream;


    status.innerHTML =
      "Camera started...";


    setupFaceMesh();


    // Start Firebase 1-second timer

    startFirebaseTimer();


  }


  catch (error) {


    console.log(error);


    status.innerHTML =
      "❌ Camera error";

  }

}


// ======================================================
// SETUP MEDIAPIPE
// ======================================================

function setupFaceMesh() {


  faceMesh = new FaceMesh({

    locateFile: function(file) {

      return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
             + file;

    }

  });


  faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

  });


  faceMesh.onResults(onResults);


  detecting = true;


  detectFace();

}


// ======================================================
// PROCESS CAMERA FRAMES
// ======================================================

async function detectFace() {


  if (!detecting) {

    return;

  }


  if (video.readyState >= 2) {


    await faceMesh.send({

      image: video

    });

  }


  requestAnimationFrame(detectFace);

}


// ======================================================
// DISTANCE BETWEEN TWO POINTS
// ======================================================

function distance(point1, point2) {


  const x =
    point1.x - point2.x;

  const y =
    point1.y - point2.y;


  return Math.sqrt(

    x * x + y * y

  );

}


// ======================================================
// EYE ASPECT RATIO
// ======================================================

function calculateEAR(

  landmarks,
  p1,
  p2,
  p3,
  p4,
  p5,
  p6

) {


  const vertical1 =
    distance(

      landmarks[p2],
      landmarks[p6]

    );


  const vertical2 =
    distance(

      landmarks[p3],
      landmarks[p5]

    );


  const horizontal =
    distance(

      landmarks[p1],
      landmarks[p4]

    );


  return (

    (vertical1 + vertical2)

    /

    (2 * horizontal)

  );

}


// ======================================================
// FACE + EYE DETECTION
// ======================================================

function onResults(results) {


  // ------------------------------------------
  // NO FACE
  // ------------------------------------------

  if (

    !results.multiFaceLandmarks ||

    results.multiFaceLandmarks.length === 0

  ) {


    status.innerHTML =
      "❌ FACE NOT DETECTED";


    // Keep previous eye status

    return;

  }


  // Get face landmarks

  const landmarks =
    results.multiFaceLandmarks[0];


  // ------------------------------------------
  // LEFT EYE
  // ------------------------------------------

  const leftEAR =
    calculateEAR(

      landmarks,

      33,
      160,
      158,
      133,
      153,
      144

    );


  // ------------------------------------------
  // RIGHT EYE
  // ------------------------------------------

  const rightEAR =
    calculateEAR(

      landmarks,

      362,
      385,
      387,
      263,
      373,
      380

    );


  // Average EAR

  const ear =
    (leftEAR + rightEAR) / 2;


  console.log(
    "EAR:",
    ear
  );


  // ------------------------------------------
  // EYES CLOSED
  // ------------------------------------------

  if (ear < 0.20) {


    status.innerHTML =
      "😴 EYES CLOSED";


    currentEyeStatus =
      "eye closed";

  }


  // ------------------------------------------
  // EYES OPEN
  // ------------------------------------------

  else {


    status.innerHTML =
      "👀 EYES OPEN";


    currentEyeStatus =
      "eye open";

  }

}


// ======================================================
// STOP CAMERA
// ======================================================

function stopCamera() {


  detecting = false;


  // Stop Firebase timer

  stopFirebaseTimer();


  if (cameraStream) {


    cameraStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });


    cameraStream = null;

  }


  video.srcObject = null;


  status.innerHTML =
    "📷 Camera OFF";


  firebaseStatus.innerHTML =
    "⚪ Firebase timer stopped";

}


</script>


</body>
</html>
