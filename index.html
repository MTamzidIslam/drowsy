<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drowsy - Eye Closure Detector</title>
    
    <!-- MEDIAPIPE -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- FIREBASE (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eeeeee;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            max-width: 400px;
            transform: scaleX(-1);
            border-radius: 8px;
            background: #333;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        #status, #firebaseStatus {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
        }
        .status-open { color: #28a745; }
        .status-closed { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>😴 Drowsy Eye Closure Detector</h2>
    
    <video id="webcam" autoplay playsinline></video>
    
    <div>
        <button class="btn-start" onclick="startCamera()">📷 Start Camera</button>
        <button class="btn-stop" onclick="stopCamera()">⛔ Camera Off</button>
    </div>

    <div id="status">Camera Status: OFF</div>
    <div id="firebaseStatus">⏳ Connecting to Firebase...</div>
</div>

<script>
    // ==========================================
    // 1. YOUR FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Check Connection
    const firebaseStatus = document.getElementById("firebaseStatus");
    if (database) {
        firebaseStatus.innerHTML = "🟢 Firebase Connected";
    } else {
        firebaseStatus.innerHTML = "🔴 Firebase Connection Failed";
    }

    // ==========================================
    // 2. EYE TRACKING & MEDIAPIPE LOGIC
    // ==========================================
    const videoElement = document.getElementById('webcam');
    const statusElement = document.getElementById('status');
    let camera = null;
    let lastStatus = ""; // Tracks changes to avoid spamming Firebase

    // MediaPipe Face Mesh Setup
    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://jsdelivr.net{file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    function onResults(results) {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
            return;
        }

        const landmarks = results.multiFaceLandmarks[0];

        // Landmark indices for Eye Aperture (Top and Bottom points of eyelids)
        // Left Eye: 386 (top), 374 (bottom) | Right Eye: 159 (top), 145 (bottom)
        const leftTop = landmarks[386];
        const leftBottom = landmarks[374];
        const rightTop = landmarks[159];
        const rightBottom = landmarks[145];

        // Calculate distance between eyelids
        const leftDist = Math.hypot(leftTop.x - leftBottom.x, leftTop.y - leftBottom.y);
        const rightDist = Math.hypot(rightTop.x - rightBottom.x, rightTop.y - rightBottom.y);
        
        // Threshold evaluation (adjust 0.015 if the sensitivity is too high/low)
        const threshold = 0.015; 
        let currentStatus = (leftDist < threshold && rightDist < threshold) ? "closed" : "open";

        // Display locally
        if (currentStatus === "closed") {
            statusElement.innerHTML = 'Eye Status: <span class="status-closed">CLOSED 😴</span>';
        } else {
            statusElement.innerHTML = 'Eye Status: <span class="status-open">OPEN 👀</span>';
        }

        // Send to Firebase ONLY when the state actually changes
        if (currentStatus !== lastStatus) {
            lastStatus = currentStatus;
            updateFirebaseStatus(currentStatus);
        }
    }

    function updateFirebaseStatus(status) {
        database.ref("eye_tracking").set({
            status: status,
            timestamp: Date.now()
        })
        .then(() => {
            firebaseStatus.innerHTML = `🟢 Firebase Sync: Eye is ${status.toUpperCase()}`;
        })
        .catch((error) => {
            console.error("Firebase write error:", error);
            firebaseStatus.innerHTML = `🔴 Sync Failed: ${error.message}`;
        });
    }

    // ==========================================
    // 3. CAMERA CONTROLS
    // ==========================================
    function startCamera() {
        statusElement.innerHTML = "Starting camera...";
        camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    }

    function stopCamera() {
        if (camera) {
            camera.stop();
            statusElement.innerHTML = "Camera Status: OFF";
            videoElement.srcObject = null;
        }
    }
</script>
</body>
</html>
