<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Drowsy: the sleep alarm</title>


  <!-- =========================
       MEDIAPIPE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


  <!-- =========================
       FIREBASE
       ========================= -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #eeeeee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 15px;
      transform: scaleX(1);
    }

    #status {
      font-size: 30px;
      font-weight: bold;
      margin: 20px;
    }

    #firebaseStatus {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
    }

    #cameraMode {
      font-size: 18px;
      font-weight: bold;
      margin: 10px;
    }

    button {
      font-size: 18px;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

  </style>

</head>


<body>


  <h1>Drowsy: the sleep alarm</h1>

  <h2>for drivers</h2>


  <!-- =========================
       CAMERA BUTTONS
       ========================= -->

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="switchCamera()">
    🔄 Switch Camera
  </button>

  <button onclick="stopCamera()">
    ⛔ Camera Off
  </button>


  <div id="cameraMode">
    Camera: Front
  </div>


  <br>


  <!-- =========================
       CAMERA
       ========================= -->

  <video id="video"
         autoplay
         playsinline>
  </video>


  <!-- =========================
       EYE STATUS
       ========================= -->

  <div id="status">
    Camera OFF
  </div>


  <!-- =========================
       FIREBASE STATUS
       ========================= -->

  <div id="firebaseStatus">
    Connecting to Firebase...
  </div>


  <!-- =========================
       FIREBASE TEST BUTTON
       ========================= -->

  <button onclick="testFirebase()">
    🧪 Test Firebase
  </button>


<script>


// ======================================================
// FIREBASE CONFIG
// ======================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyAuIPwcMswB3X3NCoreVsWZQEq0MNxvqA8",

  authDomain:
    "drowsy-ff59c.firebaseapp.com",

  databaseURL:
    "https://drowsy-ff59c-default-rtdb.firebaseio.com",

  projectId:
    "drowsy-ff59c",

  storageBucket:
    "drowsy-ff59c.firebasestorage.app",

  messagingSenderId:
    "1079489940696",

  appId:
    "1:1079489940696:web:99498117829688ba7b5bad",

  measurementId:
    "G-1F7QS9KWJ7"

};


// ======================================================
// INITIALIZE FIREBASE
// ======================================================

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


// ======================================================
// HTML ELEMENTS
// ======================================================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const firebaseStatus =
  document.getElementById("firebaseStatus");

const cameraMode =
  document.getElementById("cameraMode");


// ======================================================
// VARIABLES
// ======================================================

let faceMesh = null;

let cameraStream = null;

let detecting = false;

let detectAnimationFrame = null;


// ======================================================
// CAMERA MODE
// ======================================================

// "user"      = front camera
// "environment" = back camera

let currentCameraMode = "user";


// ======================================================
// CURRENT EYE STATUS
// ======================================================

let currentEyeStatus = "eye open";


// ======================================================
// FIREBASE TIMER
// ======================================================

let firebaseTimer = null;


// ======================================================
// FIREBASE CONNECTION STATUS
// ======================================================

firebaseStatus.innerHTML =
  "🟢 Firebase connected";


// ======================================================
// TEST FIREBASE
// ======================================================

function testFirebase() {

  firebaseStatus.innerHTML =
    "⏳ Testing Firebase write...";

  database.ref("test").push({

    message: "Hello from Drowsy!",

    time: Date.now()

  })

  .then(() => {

    firebaseStatus.innerHTML =
      "✅ Firebase WRITE successful";

  })

  .catch((error) => {

    console.log(
      "Firebase error:",
      error
    );

    firebaseStatus.innerHTML =
      "❌ Firebase WRITE failed: "
      + error.message;

  });

}


// ======================================================
// SEND EYE STATUS TO FIREBASE
// EVERY 1 SECOND
// ======================================================

function sendEyeStatusToFirebase() {

  if (!detecting) {
    return;
  }


  const eyeData = {

    eyeStatus:
      currentEyeStatus,

    timestamp:
      Date.now()

  };


  // ====================================================
  // 1. HISTORY
  // ====================================================

  const historyPromise =
    database
      .ref("drowsy")
      .push(eyeData);


  // ====================================================
  // 2. LATEST
  // ====================================================

  const latestPromise =
    database
      .ref("drowsy/latest")
      .set(eyeData);


  // ====================================================
  // WAIT FOR BOTH
  // ====================================================

  Promise.all([
    historyPromise,
    latestPromise
  ])

  .then(() => {

    console.log(
      "Firebase:",
      currentEyeStatus
    );

    firebaseStatus.innerHTML =
      "🟢 Firebase: " +
      currentEyeStatus;

  })

  .catch((error) => {

    console.log(
      "Firebase error:",
      error
    );

    firebaseStatus.innerHTML =
      "🔴 Firebase error";

  });

}


// ======================================================
// START FIREBASE TIMER
// ======================================================

function startFirebaseTimer() {

  // Prevent duplicate timers
  stopFirebaseTimer();


  // Send immediately
  sendEyeStatusToFirebase();


  // Then every 1 second
  firebaseTimer =
    setInterval(
      sendEyeStatusToFirebase,
      1000
    );

}


// ======================================================
// STOP FIREBASE TIMER
// ======================================================

function stopFirebaseTimer() {

  if (firebaseTimer) {

    clearInterval(firebaseTimer);

    firebaseTimer = null;

  }

}


// ======================================================
// START CAMERA
// ======================================================

async function startCamera() {

  // Already running
  if (cameraStream) {
    return;
  }


  try {

    status.innerHTML =
      "⏳ Starting camera...";


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            currentCameraMode

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    // --------------------------------------------------
    // Update camera label
    // --------------------------------------------------

    updateCameraLabel();


    // --------------------------------------------------
    // Mirror front camera
    // --------------------------------------------------

    if (currentCameraMode === "user") {

      video.style.transform =
        "scaleX(-1)";

    }

    else {

      video.style.transform =
        "scaleX(1)";

    }


    status.innerHTML =
      "Camera started...";


    // --------------------------------------------------
    // Setup MediaPipe
    // --------------------------------------------------

    if (!faceMesh) {

      setupFaceMesh();

    }


    detecting = true;


    detectFace();


    // --------------------------------------------------
    // Start Firebase
    // --------------------------------------------------

    startFirebaseTimer();

  }


  catch (error) {

    console.log(
      "Camera error:",
      error
    );

    cameraStream = null;

    status.innerHTML =
      "❌ Camera error: " +
      error.message;

  }

}


// ======================================================
// SWITCH FRONT / BACK CAMERA
// ======================================================

async function switchCamera() {

  // ----------------------------------------------------
  // If camera is OFF, just change selected camera
  // ----------------------------------------------------

  if (!cameraStream) {

    if (currentCameraMode === "user") {

      currentCameraMode =
        "environment";

    }

    else {

      currentCameraMode =
        "user";

    }


    updateCameraLabel();

    return;

  }


  // ----------------------------------------------------
  // Save new mode
  // ----------------------------------------------------

  if (currentCameraMode === "user") {

    currentCameraMode =
      "environment";

  }

  else {

    currentCameraMode =
      "user";

  }


  // ----------------------------------------------------
  // Stop only camera
  // ----------------------------------------------------

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    cameraStream = null;

  }


  video.srcObject = null;


  status.innerHTML =
    "⏳ Switching camera...";


  // ----------------------------------------------------
  // Start selected camera
  // ----------------------------------------------------

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            currentCameraMode

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    updateCameraLabel();


    // Front = mirrored
    // Back = normal

    if (currentCameraMode === "user") {

      video.style.transform =
        "scaleX(-1)";

    }

    else {

      video.style.transform =
        "scaleX(1)";

    }


    status.innerHTML =
      "Camera switched";


    // Keep detection running
    detecting = true;


    // Keep Firebase timer running
    startFirebaseTimer();

  }


  catch (error) {

    console.log(
      "Camera switch error:",
      error
    );


    cameraStream = null;

    video.srcObject = null;

    detecting = false;

    stopFirebaseTimer();


    status.innerHTML =
      "❌ Camera switch failed";

  }

}


// ======================================================
// UPDATE CAMERA LABEL
// ======================================================

function updateCameraLabel() {

  if (currentCameraMode === "user") {

    cameraMode.innerHTML =
      "📱 Camera: Front";

  }

  else {

    cameraMode.innerHTML =
      "📱 Camera: Back";

  }

}


// ======================================================
// SETUP MEDIAPIPE
// ======================================================

function setupFaceMesh() {

  faceMesh =
    new FaceMesh({

      locateFile: function(file) {

        return
          "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
          + file;

      }

    });


  faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

  });


  faceMesh.onResults(
    onResults
  );

}


// ======================================================
// PROCESS CAMERA FRAMES
// ======================================================

async function detectFace() {

  if (!detecting) {

    return;

  }


  if (
    video.readyState >= 2 &&
    faceMesh
  ) {

    try {

      await faceMesh.send({

        image: video

      });

    }

    catch (error) {

      console.log(
        "MediaPipe error:",
        error
      );

    }

  }


  detectAnimationFrame =
    requestAnimationFrame(
      detectFace
    );

}


// ======================================================
// DISTANCE BETWEEN TWO POINTS
// ======================================================

function distance(
  point1,
  point2
) {

  const x =
    point1.x -
    point2.x;

  const y =
    point1.y -
    point2.y;


  return Math.sqrt(

    x * x +
    y * y

  );

}


// ======================================================
// EYE ASPECT RATIO
// ======================================================

function calculateEAR(

  landmarks,
  p1,
  p2,
  p3,
  p4,
  p5,
  p6

) {

  const vertical1 =
    distance(

      landmarks[p2],
      landmarks[p6]

    );


  const vertical2 =
    distance(

      landmarks[p3],
      landmarks[p5]

    );


  const horizontal =
    distance(

      landmarks[p1],
      landmarks[p4]

    );


  return (

    (vertical1 + vertical2) /
    (2 * horizontal)

  );

}


// ======================================================
// FACE + EYE DETECTION
// ======================================================

function onResults(results) {

  // ----------------------------------------------------
  // NO FACE
  // ----------------------------------------------------

  if (

    !results.multiFaceLandmarks ||

    results.multiFaceLandmarks.length === 0

  ) {

    status.innerHTML =
      "❌ FACE NOT DETECTED";

    return;

  }


  // ----------------------------------------------------
  // FACE LANDMARKS
  // ----------------------------------------------------

  const landmarks =
    results.multiFaceLandmarks[0];


  // ----------------------------------------------------
  // LEFT EYE
  // ----------------------------------------------------

  const leftEAR =
    calculateEAR(

      landmarks,

      33,
      160,
      158,
      133,
      153,
      144

    );


  // ----------------------------------------------------
  // RIGHT EYE
  // ----------------------------------------------------

  const rightEAR =
    calculateEAR(

      landmarks,

      362,
      385,
      387,
      263,
      373,
      380

    );


  // ----------------------------------------------------
  // AVERAGE EAR
  // ----------------------------------------------------

  const ear =
    (leftEAR + rightEAR) / 2;


  console.log(
    "EAR:",
    ear
  );


  // ----------------------------------------------------
  // EYES CLOSED
  // ----------------------------------------------------

  if (ear < 0.20) {

    status.innerHTML =
      "😴 EYES CLOSED";


    currentEyeStatus =
      "eye closed";

  }


  // ----------------------------------------------------
  // EYES OPEN
  // ----------------------------------------------------

  else {

    status.innerHTML =
      "👀 EYES OPEN";


    currentEyeStatus =
      "eye open";

  }

}


// ======================================================
// STOP CAMERA
// ======================================================

function stopCamera() {

  detecting = false;


  // Stop animation loop
  if (detectAnimationFrame) {

    cancelAnimationFrame(
      detectAnimationFrame
    );

    detectAnimationFrame = null;

  }


  // Stop Firebase
  stopFirebaseTimer();


  // Stop camera tracks
  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    cameraStream = null;

  }


  video.srcObject = null;


  status.innerHTML =
    "📷 Camera OFF";


  firebaseStatus.innerHTML =
    "⚪ Firebase timer stopped";

}


// ======================================================
// INITIAL CAMERA LABEL
// ======================================================

updateCameraLabel();


</script>


</body>
</html>
