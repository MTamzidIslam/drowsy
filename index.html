<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Drowsy: the sleep alarm</title>


  <!-- ==================================================
       MEDIAPIPE
       ================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


  <!-- ==================================================
       FIREBASE
       ================================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


  <!-- ==================================================
       STYLE
       ================================================== -->

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eeeeee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 15px;
      background: black;
    }

    button {
      font-size: 18px;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #cameraMode {
      font-size: 18px;
      font-weight: bold;
      margin: 12px;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
      margin: 15px;
    }

    #faceStatus {
      font-size: 22px;
      font-weight: bold;
      margin: 10px;
    }

    #eyeStatus {
      font-size: 26px;
      font-weight: bold;
      margin: 10px;
    }

    #earValue {
      font-size: 18px;
      font-weight: bold;
      margin: 10px;
    }

    #firebaseStatus {
      font-size: 18px;
      font-weight: bold;
      margin: 15px;
    }

  </style>

</head>


<body>

  <h1>Drowsy: the sleep alarm</h1>

  <h2>for drivers</h2>


  <!-- ==================================================
       CAMERA BUTTONS
       ================================================== -->

  <button onclick="startCamera()">
    📷 Start Camera
  </button>

  <button onclick="switchCamera()">
    🔄 Switch Camera
  </button>

  <button onclick="stopCamera()">
    ⛔ Camera Off
  </button>


  <div id="cameraMode">
    📱 Camera: Front
  </div>


  <!-- ==================================================
       VIDEO
       ================================================== -->

  <video id="video"
         autoplay
         playsinline
         muted>
  </video>


  <!-- ==================================================
       DETECTION STATUS
       ================================================== -->

  <div id="status">
    📷 Camera OFF
  </div>

  <div id="faceStatus">
    Face: --
  </div>

  <div id="eyeStatus">
    Eyes: --
  </div>

  <div id="earValue">
    EAR: --
  </div>


  <!-- ==================================================
       FIREBASE STATUS
       ================================================== -->

  <div id="firebaseStatus">
    🟢 Firebase connected
  </div>


  <!-- ==================================================
       FIREBASE TEST
       ================================================== -->

  <button onclick="testFirebase()">
    🧪 Test Firebase
  </button>


<script>


// ======================================================
// FIREBASE CONFIG
// ======================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyAuIPwcMswB3X3NCoreVsWZQEq0MNxvqA8",

  authDomain:
    "drowsy-ff59c.firebaseapp.com",

  databaseURL:
    "https://drowsy-ff59c-default-rtdb.firebaseio.com",

  projectId:
    "drowsy-ff59c",

  storageBucket:
    "drowsy-ff59c.firebasestorage.app",

  messagingSenderId:
    "1079489940696",

  appId:
    "1:1079489940696:web:99498117829688ba7b5bad",

  measurementId:
    "G-1F7QS9KWJ7"

};


// ======================================================
// INITIALIZE FIREBASE
// ======================================================

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


// ======================================================
// HTML ELEMENTS
// ======================================================

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");

const faceStatus =
  document.getElementById("faceStatus");

const eyeStatus =
  document.getElementById("eyeStatus");

const earValue =
  document.getElementById("earValue");

const firebaseStatus =
  document.getElementById("firebaseStatus");

const cameraMode =
  document.getElementById("cameraMode");


// ======================================================
// VARIABLES
// ======================================================

let faceMesh = null;

let cameraStream = null;

let detecting = false;

let detectAnimationFrame = null;

let lastDetectionTime = 0;

let currentCameraMode = "user";

let currentEyeStatus = "eye open";

let firebaseTimer = null;


// ======================================================
// CAMERA LABEL
// ======================================================

function updateCameraLabel() {

  if (currentCameraMode === "user") {

    cameraMode.innerHTML =
      "📱 Camera: Front";

  } else {

    cameraMode.innerHTML =
      "📱 Camera: Back";

  }

}


// ======================================================
// FIREBASE TEST
// ======================================================

function testFirebase() {

  firebaseStatus.innerHTML =
    "⏳ Testing Firebase...";


  database
    .ref("test")
    .push({

      message:
        "Hello from Drowsy!",

      time:
        Date.now()

    })

    .then(() => {

      firebaseStatus.innerHTML =
        "✅ Firebase WRITE successful";

    })

    .catch((error) => {

      console.error(
        "Firebase error:",
        error
      );

      firebaseStatus.innerHTML =
        "❌ Firebase WRITE failed";

    });

}


// ======================================================
// SEND EYE STATUS TO FIREBASE
// ======================================================

function sendEyeStatusToFirebase() {

  if (!detecting) {
    return;
  }


  const eyeData = {

    eyeStatus:
      currentEyeStatus,

    timestamp:
      Date.now()

  };


  // ----------------------------------------------------
  // HISTORY
  // ----------------------------------------------------

  const historyPromise =
    database
      .ref("drowsy")
      .push(eyeData);


  // ----------------------------------------------------
  // LATEST
  // ----------------------------------------------------

  const latestPromise =
    database
      .ref("drowsy/latest")
      .set(eyeData);


  Promise.all([
    historyPromise,
    latestPromise
  ])

  .then(() => {

    console.log(
      "Firebase:",
      eyeData
    );

    firebaseStatus.innerHTML =
      "🟢 Firebase: " +
      currentEyeStatus;

  })

  .catch((error) => {

    console.error(
      "Firebase error:",
      error
    );

    firebaseStatus.innerHTML =
      "🔴 Firebase error";

  });

}


// ======================================================
// START FIREBASE TIMER
// ======================================================

function startFirebaseTimer() {

  stopFirebaseTimer();


  sendEyeStatusToFirebase();


  firebaseTimer =
    setInterval(
      sendEyeStatusToFirebase,
      1000
    );

}


// ======================================================
// STOP FIREBASE TIMER
// ======================================================

function stopFirebaseTimer() {

  if (firebaseTimer) {

    clearInterval(firebaseTimer);

    firebaseTimer = null;

  }

}


// ======================================================
// START CAMERA
// ======================================================

async function startCamera() {

  if (cameraStream) {
    return;
  }


  try {

    status.innerHTML =
      "⏳ Starting camera...";


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: currentCameraMode
          },

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    video.muted = true;

    video.playsInline = true;


    await video.play();


    // --------------------------------------------------
    // Mirror front camera
    // --------------------------------------------------

    if (currentCameraMode === "user") {

      video.style.transform =
        "scaleX(-1)";

    } else {

      video.style.transform =
        "scaleX(1)";

    }


    updateCameraLabel();


    // --------------------------------------------------
    // MediaPipe
    // --------------------------------------------------

    if (!faceMesh) {

      setupFaceMesh();

    }


    detecting = true;

    lastDetectionTime = 0;


    status.innerHTML =
      "🔍 Detecting face...";


    faceStatus.innerHTML =
      "🔍 Searching...";


    eyeStatus.innerHTML =
      "Eyes: --";


    earValue.innerHTML =
      "EAR: --";


    detectFace(
      performance.now()
    );


    startFirebaseTimer();

  }


  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    cameraStream = null;


    status.innerHTML =
      "❌ Camera error: " +
      error.message;

  }

}


// ======================================================
// SWITCH FRONT / BACK CAMERA
// ======================================================

async function switchCamera() {

  // ----------------------------------------------------
  // Change selected camera if camera is OFF
  // ----------------------------------------------------

  if (!cameraStream) {

    if (currentCameraMode === "user") {

      currentCameraMode =
        "environment";

    } else {

      currentCameraMode =
        "user";

    }


    updateCameraLabel();

    return;

  }


  // ----------------------------------------------------
  // Switch mode
  // ----------------------------------------------------

  if (currentCameraMode === "user") {

    currentCameraMode =
      "environment";

  } else {

    currentCameraMode =
      "user";

  }


  // ----------------------------------------------------
  // Stop old stream
  // ----------------------------------------------------

  cameraStream
    .getTracks()
    .forEach(track => {

      track.stop();

    });


  cameraStream = null;

  video.srcObject = null;


  status.innerHTML =
    "⏳ Switching camera...";


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: currentCameraMode
          },

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    video.muted = true;

    video.playsInline = true;


    await video.play();


    if (currentCameraMode === "user") {

      video.style.transform =
        "scaleX(-1)";

    } else {

      video.style.transform =
        "scaleX(1)";

    }


    updateCameraLabel();


    detecting = true;

    lastDetectionTime = 0;


    status.innerHTML =
      "🔍 Detecting face...";


    detectFace(
      performance.now()
    );


    startFirebaseTimer();

  }


  catch (error) {

    console.error(
      "Camera switch error:",
      error
    );


    cameraStream = null;

    video.srcObject = null;

    detecting = false;

    stopFirebaseTimer();


    status.innerHTML =
      "❌ Camera switch failed";

  }

}


// ======================================================
// SETUP MEDIAPIPE
// ======================================================

function setupFaceMesh() {

  faceMesh =
    new FaceMesh({

      locateFile: function(file) {

        return (
          "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
          + file
        );

      }

    });


  faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

  });


  faceMesh.onResults(
    onResults
  );

}


// ======================================================
// PROCESS CAMERA FRAMES
// ======================================================

async function detectFace(timestamp) {

  if (!detecting) {
    return;
  }


  // ----------------------------------------------------
  // Approximately 15 FPS
  // ----------------------------------------------------

  if (

    video.readyState >=
    HTMLMediaElement.HAVE_CURRENT_DATA &&

    faceMesh &&

    timestamp - lastDetectionTime >= 66

  ) {

    lastDetectionTime =
      timestamp;


    try {

      await faceMesh.send({

        image: video

      });

    }

    catch (error) {

      console.error(
        "MediaPipe error:",
        error
      );

    }

  }


  detectAnimationFrame =
    requestAnimationFrame(
      detectFace
    );

}


// ======================================================
// DISTANCE BETWEEN POINTS
// ======================================================

function distance(
  point1,
  point2
) {

  const x =
    point1.x -
    point2.x;


  const y =
    point1.y -
    point2.y;


  return Math.sqrt(

    x * x +
    y * y

  );

}


// ======================================================
// EAR
// ======================================================

function calculateEAR(

  landmarks,

  p1,
  p2,
  p3,
  p4,
  p5,
  p6

) {

  const vertical1 =
    distance(
      landmarks[p2],
      landmarks[p6]
    );


  const vertical2 =
    distance(
      landmarks[p3],
      landmarks[p5]
    );


  const horizontal =
    distance(
      landmarks[p1],
      landmarks[p4]
    );


  if (horizontal === 0) {

    return 0;

  }


  return (

    (vertical1 + vertical2) /
    (2 * horizontal)

  );

}


// ======================================================
// FACE + EYE DETECTION
// ======================================================

function onResults(results) {

  // ----------------------------------------------------
  // NO FACE
  // ----------------------------------------------------

  if (

    !results.multiFaceLandmarks ||

    results.multiFaceLandmarks.length === 0

  ) {

    faceStatus.innerHTML =
      "❌ FACE NOT DETECTED";


    eyeStatus.innerHTML =
      "Eyes: --";


    earValue.innerHTML =
      "EAR: --";


    status.innerHTML =
      "🔍 Looking for face...";


    return;

  }


  // ----------------------------------------------------
  // FACE DETECTED
  // ----------------------------------------------------

  faceStatus.innerHTML =
    "✅ FACE DETECTED";


  const landmarks =
    results.multiFaceLandmarks[0];


  // ----------------------------------------------------
  // LEFT EYE
  // ----------------------------------------------------

  const leftEAR =
    calculateEAR(

      landmarks,

      33,
      160,
      158,
      133,
      153,
      144

    );


  // ----------------------------------------------------
  // RIGHT EYE
  // ----------------------------------------------------

  const rightEAR =
    calculateEAR(

      landmarks,

      362,
      385,
      387,
      263,
      373,
      380

    );


  // ----------------------------------------------------
  // AVERAGE EAR
  // ----------------------------------------------------

  const ear =
    (leftEAR + rightEAR) / 2;


  earValue.innerHTML =
    "EAR: " +
    ear.toFixed(3);


  // ----------------------------------------------------
  // CLOSED
  // ----------------------------------------------------

  if (ear < 10) {

    eyeStatus.innerHTML =
      "😴 EYES CLOSED";


    status.innerHTML =
      "✅ FACE DETECTED";


    currentEyeStatus =
      "eye closed";

  }


  // ----------------------------------------------------
  // OPEN
  // ----------------------------------------------------

  else {

    eyeStatus.innerHTML =
      "👀 EYES OPEN";


    status.innerHTML =
      "✅ FACE DETECTED";


    currentEyeStatus =
      "eye open";

  }

}


// ======================================================
// STOP CAMERA
// ======================================================

function stopCamera() {

  detecting = false;


  if (detectAnimationFrame) {

    cancelAnimationFrame(
      detectAnimationFrame
    );

    detectAnimationFrame = null;

  }


  stopFirebaseTimer();


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    cameraStream = null;

  }


  video.srcObject =
    null;


  status.innerHTML =
    "📷 Camera OFF";


  faceStatus.innerHTML =
    "Face: --";


  eyeStatus.innerHTML =
    "Eyes: --";


  earValue.innerHTML =
    "EAR: --";


  firebaseStatus.innerHTML =
    "⚪ Firebase timer stopped";

}


// ======================================================
// INITIAL CAMERA LABEL
// ======================================================

updateCameraLabel();


</script>

</body>
</html>
