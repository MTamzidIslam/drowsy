<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eye Closure Detector</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #eeeeee;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
    }

    #status {
      font-size: 32px;
      font-weight: bold;
      margin: 20px;
    }
  </style>
</head>

<body>

  <h1>👁️ Eye Closure Detector</h1>

  <button onclick="startCamera()">Start Camera</button>

  <br><br>

  <video id="video" autoplay playsinline></video>

  <div id="status">Press Start Camera</div>

  <script>

    const video = document.getElementById("video");
    const status = document.getElementById("status");

    let faceMesh;

    function startCamera() {

      faceMesh = new FaceMesh({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(detectEyes);

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        }
      }).then(stream => {

        video.srcObject = stream;

        video.onloadeddata = () => {
          detectVideo();
        };

      }).catch(error => {

        status.innerHTML = "Camera permission denied";

      });
    }


    async function detectVideo() {

      await faceMesh.send({
        image: video
      });

      requestAnimationFrame(detectVideo);
    }


    function detectEyes(results) {

      if (!results.multiFaceLandmarks ||
          results.multiFaceLandmarks.length === 0) {

        status.innerHTML = "No face detected";
        return;
      }

      status.innerHTML = "Face detected 👤";

    }

  </script>

</body>
</html>
